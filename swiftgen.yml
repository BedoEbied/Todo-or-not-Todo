input_dir: todoornottodo/
output_dir: todoornottodo/Generated/

xcassets:
  inputs:
    - Assets.xcassets
  outputs:
    - templateName: swift5
      params:
        forceProvidesNamespaces: true
        enumName: Assets
      output: Assets.swift

strings:
  inputs:
    - Resources/en.lproj/Localizable.strings
  outputs:
    - templateName: structured-swift5
      params:
        enumName: Strings
      output: Strings.swift